# Veritas 配置示例  →  cp dispatch.example.yaml dispatch.yaml

database:
  dsn: "postgresql://veritas:veritas@127.0.0.1:5432/veritas"

# 渗透目标与目标访问级别
target: "http://localhost:3000"
goal: "shell"            # external < recon < web_user < web_admin < db_read < shell < root < domain_admin

llm:
  mode: "mock"           # mock（M0，无需 LLM/真实目标）| live（M1+）
  model: "openai/glm-5.3"
  # api_base: "https://open.bigmodel.cn/api/paas/v4"
  # api_key_env: "GLM_API_KEY"

runtime:
  execution: "local"
  workers: 2
  max_rounds: 30

# 授权边界（含内网网段，横向目标也须在 scope）
scope:
  domains: ["localhost", "127.0.0.1"]
  cidrs: ["127.0.0.0/8", "10.0.0.0/8"]
