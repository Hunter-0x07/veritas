[project]
name = "veritas"
version = "0.2.0"
description = "自动化渗透引擎：在攻击图上做访问权限推进，从 Web 到内网横向"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0.2",
    "litellm>=1.50.0",
    "playwright>=1.47.0",
]

[project.scripts]
veritas = "veritas.cli:main"   # M0 建包后可 `pip install -e .` 启用

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["veritas"]
