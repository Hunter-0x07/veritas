# Veritas 配置示例  →  cp dispatch.example.yaml dispatch.yaml

database:
  dsn: "postgresql://veritas:veritas@127.0.0.1:5432/veritas"

# 渗透目标与目标访问级别
target: "http://localhost:3000"
goal: "shell"            # external < recon < web_user < web_admin < db_read < shell < root < domain_admin

llm:
  mode: "mock"           # mock（M0，无需 LLM/真实目标）| live（M1+）
  model: "openai/glm-5.3"
  # api_base: "https://open.bigmodel.cn/api/paas/v4"
  # api_key_env: "GLM_API_KEY"

runtime:
  execution: "local"
  workers: 2
  max_rounds: 30
  max_steps: 120           # 每个机会的 agentic loop 步数上限（冷图压缩解耦成本后可放开；深链调大）
  # 冷图压缩（控长程 token 成本，见 veritas/llm/compaction.py）。效果优先→默认宽松，只在很长的 run 才触发。
  compact_chars: 200000    # 转录超此字符量(≈50K tokens)才折叠旧 round-trip；想 live 看触发可临时调小(如 8000)
  compact_keep: 8          # 压缩时保留最近 N 个完整 round-trip（热前沿）逐字不折
  no_progress_limit: 30    # 无进展熔断：loop 连续 N 步没拿到新战果就早停(堵"够不到目标满世界乱撞烧满预算")；0=关闭

# verifier Stage 2 主动探针的 safe-probe 策略（见 veritas/core/prober.py）。
# 主动探针在 verifier 判定前，用立足点自己的访问向量发起"只有真拿下才能通过"的挑战
# （随机 nonce 回环 / 重认证 / 重跑 DCSync），拿确定性的证成或证伪。
probe:
  enabled: true
  # authorization: external=外部授权目标(HackerOne 式，默认·保守)——只放【低噪声】探针(单次 nonce 回环)，
  #   重认证/重 DCSync 等高噪声声称降级为被动 proof-of-effect + 可复现 PoC(+可选 LLM-judge)；
  #   lab=授权靶场(试验台)——各级主动探针都开(重认证、重跑 DCSync 坐实)。
  authorization: "external"
  budget: 8          # 本次 run 的主动探针执行预算（防对目标连续重活/限速/告警）
  llm_judge: false   # 外部降级路径是否启用 LLM-judge 辅助评级（低信任档，绝不单独抬成 verified）

# 授权边界（安全闸·见 veritas/safety/scope.py）：执行前从命令抽【连接目标】主机/IP，比对
# domains + CIDR——域内放行、域外拒绝、抽不到主机的本地命令放行。**内网横向目标也须在 scope**
# （内网走 cidrs；单标签容器名如 lab-edge 无法 CIDR 校验，默认放行不误杀）。domains/cidrs 都空
# = 不强制（放行一切）。第一性：真实目标是 HackerOne 这类授权外部目标，scope 是碰真目标前的硬边界。
scope:
  domains: ["localhost", "127.0.0.1"]
  cidrs: ["127.0.0.0/8", "10.0.0.0/8"]
  # 授权外部目标：把 bug bounty 范围的主机/网段列进来（用 /32 精确授权单台），例：
  # domains: ["app.example.com", "api.example.com"]
  # cidrs: ["198.51.100.0/24"]   # ← 用真实授权网段；仓库文档一律用 RFC5737 脱敏

# 分级自主 / 审批门（HITL·见 veritas/safety/autonomy.py）：破坏性/高噪声动作（删/写系统文件、
# 大范围扫描 nmap -p-/masscan、在线爆破 hydra/medusa）在 approval 模式下要人工审批。与 safe-probe
# 的授权档对齐：mode=auto 时按 probe.authorization 推导（lab→full_auto 全放行 / external→approval）。
autonomy:
  mode: "auto"        # auto（按 probe.authorization 推导）| full_auto（全放行）| approval（破坏性需审批）
  # 当前引擎全自动无人在环：approval 下遇需审批动作——
  on_gated: "deny"    # deny（拦截+记录·fail-closed·默认·安全闸）| allow（放行+记录·fail-open·仅遥测）

# 跨 run 策略记忆（M5·见 veritas/core/memory.py）：run 结束把【已验证】成功 kill chain 蒸馏成策略入库，
# 新 run 遇相似目标检索复用为【提示】（启动注入 + solver 的 recall_strategy 工具）。纪律：只记动作/漏洞
# 路径（脱敏·绝不记跨 run 的凭据/secret）；提示永不驱动 verdict（verifier/prober 仍从真实输出重推）。
memory:
  enabled: true       # A/B 验证 / 干净复现时设 false——跨 run 记忆会让各 run 行为互相依赖
  max_hints: 3        # 启动提示 / recall_strategy 注入的最多策略条数
